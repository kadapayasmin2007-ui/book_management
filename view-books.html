
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Books | BookNest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>📚 BookNest</h1>
    <p>Book Management System</p>
</header>

<nav>
    <a href="/">Home</a>
    <a href="add-book.html">Add Book</a>
    <a href="view-books.html">View Books</a>
</nav>

<main class="container">
    <h2>Available Books</h2>
    <p>View and manage all your books.</p>

    <input type="text" id="search"
           placeholder="Search by book name or author..."
           onkeyup="searchBooks()">

    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="bookList"></tbody>
        </table>
    </div>
    <p id="message"></p>
</main>

<footer>
    <p>© 2026 BookNest | Book Management System</p>
</footer>

<script>
let allBooks = [];

async function loadBooks() {
    try {
        const response = await fetch("/books");
        if (!response.ok) throw new Error("Unable to load books");

        allBooks = await response.json();
        displayBooks(allBooks);
    } catch (error) {
        document.getElementById("message").innerText =
            "Error loading books. Check server connection.";
    }
}

function displayBooks(books) {
    const bookList = document.getElementById("bookList");
    bookList.innerHTML = "";

    if (books.length === 0) {
        bookList.innerHTML =
            `<tr><td colspan="7">No books found</td></tr>`;
        return;
    }

    books.forEach((book, index) => {
        const row = document.createElement("tr");
        const values = [
              index + 1,
              book.book_name,
              book.author,
              book.category,
              "₹" + book.price,
              book.stock
        ];

        values.forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value ?? "";
            row.appendChild(cell);
        });

        const actions = document.createElement("td");

        const updateBtn = document.createElement("button");
        updateBtn.textContent = "Update";
        updateBtn.onclick = () => {
            window.location.href =
                "update-book.html?id=" + encodeURIComponent(book.book_id);
        };

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.style.marginLeft = "6px";
        deleteBtn.onclick = () => deleteBook(book.book_id);

        actions.appendChild(updateBtn);
        actions.appendChild(deleteBtn);
        row.appendChild(actions);

        bookList.appendChild(row);
    });
}

function searchBooks() {
    const search = document.getElementById("search").value.toLowerCase();

    const filtered = allBooks.filter(book =>
        (book.book_name || "").toLowerCase().includes(search) ||
        (book.author || "").toLowerCase().includes(search)
    );

    displayBooks(filtered);
}

async function deleteBook(id) {
    if (!confirm("Are you sure you want to delete this book?")) return;

    try {
        const response = await fetch("/books/" + id, {
            method: "DELETE"
        });

        const result = await response.json();

        if (!response.ok) {
            alert(result.message || result.error || "Delete failed");
            return;
        }

        alert("Book deleted successfully!");
        loadBooks();
    } catch (error) {
        alert("Server connection failed!");
    }
}

loadBooks();
</script>

</body>
</html>
